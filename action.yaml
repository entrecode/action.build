name: Build-Action
description: 'build and push to ghcr'

inputs:
  PAT:
    description: 'PAT from repo'
    required: true
  NAMESPACE:
    description: 'Namespace'
    required: true
  NAME:
    description: 'Name'
    required: true
  ACTION_ENABLE_TESTING:
    description: 'if set to true, testcontainer will be created and tests will be run'
    required: false
    default: 'false'
  GITHUB_TOKEN:
    description: 'Github Token'
    required: true
  LOCAL_TESTING_SECRET:
    description: 'local-testing.yaml secret'
    required: false
    default: 'false'
  WORKING_DIRECTORY:
    description: 'Working directory of the project'
    required: false
    default: '.'
  DOCKER_CONTEXT:
    description: 'Docker context'
    required: false
    default: '.'
  DOCKERFILE:
    description: 'Dockerfile'
    required: false
    default: './Dockerfile'
  DBPORT:
    description: 'port of the database'
    required: false
    default: '5432'
  OVERWRITE_BUILD_TASK:
    description: 'Build task to overwrite'
    required: false
    default: 'false'
  CACHE_SCOPE:
    description: 'Overrides the build cache scope. Defaults to prod for tags, staging for release/*, else the branch name.'
    required: false
    default: ''

outputs:
  version:
    description: 'version of the container'
    value: ${{ steps.set-output.outputs.version }}
  env:
    description: 'environment of the container'
    value: ${{ steps.set-output.outputs.env }}

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # - name: Check COPY . . in Dockerfile
    #   run: |
    #     if grep -q "COPY.*\. \." ${{ inputs.DOCKERFILE }}; then
    #       echo "COPY . . is not allowed in Dockerfile"
    #       exit 1
    #     fi
    #   shell: bash

    - name: Set BUILD_TASK
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "BUILD_TASK=prod" >> $GITHUB_ENV
        else
          echo "BUILD_TASK=stage" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Login to Github Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.GITHUB_TOKEN }}
        logout: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: network=host
        buildkitd-config-inline: |
          [registry."localhost:5000"]
            http = true
            insecure = true

    - name: Set build cache configuration
      run: |
        CACHE_REF="${{ inputs.NAMESPACE }}.${{ inputs.NAME }}"
        TARGETS="runner"
        if [ "${{ inputs.ACTION_ENABLE_TESTING }}" = "true" ]; then
          TARGETS="tester runner"
        fi

        # Builds of different refs run in parallel (the concurrency group in the
        # calling workflow is per ref) and used to share a single cache tag. One
        # run could publish a manifest referencing blobs another run had not
        # finished uploading, which poisons the cache until it is deleted by
        # hand. One scope per ref plus that concurrency group leaves exactly one
        # writer per tag.
        if [ -n "${{ inputs.CACHE_SCOPE }}" ]; then
          SCOPE="${{ inputs.CACHE_SCOPE }}"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          SCOPE="prod"
        elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
          SCOPE="staging"
        else
          SCOPE="${{ github.ref_name }}"
        fi
        # Registry tags allow [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}, branch names do not.
        SCOPE="$(printf '%s' "$SCOPE" | tr -c 'a-zA-Z0-9._-' '-' | cut -c1-100)"
        case "$SCOPE" in [a-zA-Z0-9_]*) ;; *) SCOPE="x${SCOPE}" ;; esac

        # Exports go to a tag nobody reads. Only a build that finished and
        # verified gets promoted onto $SCOPE, so a cancelled or failed run
        # cannot publish a half written cache.
        RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"

        echo "CACHE_SCOPE=${SCOPE}" >> $GITHUB_ENV
        echo "CACHE_RUN_TAG=${RUN_TAG}" >> $GITHUB_ENV

        if [ "${{ runner.environment }}" = "self-hosted" ]; then
          CANDIDATES="$SCOPE"
          if [ "$SCOPE" != "develop" ]; then
            CANDIDATES="$SCOPE develop"
          fi

          for TARGET in $TARGETS; do
            REPO="buildcache/${CACHE_REF}-${TARGET}"
            REF="localhost:5000/${REPO}"
            echo "CACHE_REPO_${TARGET^^}=${REPO}" >> $GITHUB_ENV

            # A corrupt cache ref imports without complaint and only kills the
            # build seconds later, when a blob turns out to be unreadable. So
            # every candidate is checked before it is handed to buildx: a bad
            # one costs this build its cache instead of the whole release.
            REPORT="$(mktemp)"
            "${{ github.action_path }}/scripts/buildcache.sh" usable "$REPO" $CANDIDATES > "$REPORT" || true
            echo "cache refs for ${REPO}:"
            cat "$REPORT"
            while read -r BAD; do
              echo "::warning::build cache ${REPO}:${BAD} is corrupt and was skipped, it should be purged"
            done < <(awk '$1 == "skip" && $3 == "corrupt" { print $2 }' "$REPORT")

            {
              echo "CACHE_FROM_${TARGET^^}<<CACHE_EOF"
              awk -v ref="$REF" '$1 == "use" { print "type=registry,ref=" ref ":" $2 }' "$REPORT"
              echo "CACHE_EOF"
            } >> $GITHUB_ENV
            echo "CACHE_TO_${TARGET^^}=type=registry,ref=${REF}:${RUN_TAG},mode=max,ignore-error=true" >> $GITHUB_ENV
            rm -f "$REPORT"
          done
        else
          for TARGET in $TARGETS; do
            GHA_SCOPE="${CACHE_REF}-${TARGET}"
            echo "CACHE_FROM_${TARGET^^}=type=gha,scope=${GHA_SCOPE}" >> $GITHUB_ENV
            echo "CACHE_TO_${TARGET^^}=type=gha,mode=max,scope=${GHA_SCOPE},ignore-error=true" >> $GITHUB_ENV
          done
        fi
      shell: bash

    - name: get-npm-version
      id: package-version
      run: |
        PACKAGE_VERSION=$(cat ${{ inputs.WORKING_DIRECTORY }}/package.json | jq '.version' | tr -d '"')
        echo "current-version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Extract branch name
      run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV
      shell: bash

    - name: Build Container name for develop
      if: startsWith(github.ref, 'refs/tags/') != true && startsWith(github.ref, 'refs/heads/release/') != true
      run: |
        echo "IMAGE_TAG=${{env.BRANCH_NAME }}" >> $GITHUB_ENV
        echo "ENV=stage" >> $GITHUB_ENV
      shell: bash

    - name: Build Container name for staging
      if: startsWith(github.ref, 'refs/heads/release/')
      run: |
        echo "IMAGE_TAG=staging" >> $GITHUB_ENV
        echo "ENV=stage" >> $GITHUB_ENV
      shell: bash

    - name: Build Container name for master
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "IMAGE_TAG=${{ steps.package-version.outputs.current-version}}" >> $GITHUB_ENV
        echo "ENV=prod" >> $GITHUB_ENV
      shell: bash

    - name: Check file existence (next)
      id: check_files_next
      uses: andstor/file-existence-action@v3
      with:
        files: '${{ inputs.WORKING_DIRECTORY }}/.env.production, ${{ inputs.WORKING_DIRECTORY }}/next.config.*'

    - name: Check file existence (astro)
      id: check_files_astro
      uses: andstor/file-existence-action@v3
      with:
        files: '${{ inputs.WORKING_DIRECTORY }}/.env.production, ${{ inputs.WORKING_DIRECTORY }}/astro.config.mjs'

    - name: Remove production environment file on develop for next/astro projects
      if: github.ref == 'refs/heads/develop' && (steps.check_files_next.outputs.files_exists == 'true' || steps.check_files_astro.outputs.files_exists == 'true')
      run: |
        rm -f ${{ inputs.WORKING_DIRECTORY }}/.env.production
      shell: bash

    - name: Write local-testing config file
      if: inputs.LOCAL_TESTING_SECRET != 'false'
      uses: DamianReeves/write-file-action@master # TODO replace
      with:
        path: ${{ inputs.WORKING_DIRECTORY }}/config/local.yaml
        contents: |
          ${{ inputs.LOCAL_TESTING_SECRET }}

    - name: Set up docker buildx for tester
      if: inputs.ACTION_ENABLE_TESTING == 'true'
      id: tester
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.DOCKER_CONTEXT }}
        file: ${{ inputs.DOCKERFILE }}
        load: true
        target: tester
        platforms: linux/amd64
        network: host # ?
        tags: ghcr.io/entrecode/${{ inputs.NAMESPACE }}.${{ inputs.NAME}}:tester-${{ env.BUILD_TASK }}
        cache-from: |
          ${{ env.CACHE_FROM_TESTER }}
          ${{ env.CACHE_FROM_RUNNER }}
        cache-to: ${{ env.CACHE_TO_TESTER }}
        build-args: |
          PAT=${{ inputs.PAT }}

    - name: Test
      if: inputs.ACTION_ENABLE_TESTING == 'true'
      id: testrunner
      run: |
        docker run --network="host" --rm -e DBPORT=${{ inputs.DBPORT }} ghcr.io/entrecode/${{ inputs.NAMESPACE }}.${{ inputs.NAME}}:tester-${{ env.BUILD_TASK }}
      shell: bash

    - name: Remove local testing file
      if: inputs.LOCAL_TESTING_SECRET != 'false'
      run: |
        rm -f ${{ inputs.WORKING_DIRECTORY }}/config/local.yaml
      shell: bash

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.DOCKER_CONTEXT }}
        file: ${{ inputs.DOCKERFILE }}
        push: true
        target: runner
        platforms: linux/amd64
        tags: ghcr.io/entrecode/${{ inputs.NAMESPACE }}.${{ inputs.NAME}}:${{ env.IMAGE_TAG }}
        cache-from: |
          ${{ inputs.ACTION_ENABLE_TESTING == 'true' && env.CACHE_FROM_TESTER || '' }}
          ${{ env.CACHE_FROM_RUNNER }}
        cache-to: ${{ env.CACHE_TO_RUNNER }}
        build-args: |
          PAT=${{ inputs.PAT }}
          BUILD_TASK=${{ inputs.OVERWRITE_BUILD_TASK != 'false' && inputs.OVERWRITE_BUILD_TASK || env.BUILD_TASK }}

    - name: Promote build cache
      if: ${{ runner.environment == 'self-hosted' }}
      run: |
        # A failed promotion costs the next build its cache, nothing more. It
        # must never fail a release that is already built and pushed.
        for TARGET in TESTER RUNNER; do
          REPO_VAR="CACHE_REPO_${TARGET}"
          REPO="${!REPO_VAR:-}"
          [ -n "$REPO" ] || continue
          "${{ github.action_path }}/scripts/buildcache.sh" promote \
            "$REPO" "${CACHE_RUN_TAG}" "${CACHE_SCOPE}" \
            || echo "::warning::could not promote ${REPO}:${CACHE_SCOPE}, next build rebuilds without cache"
        done
      shell: bash

    - name: Set output
      id: set-output
      run: |
        echo "version=${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
        echo "env=${{ env.ENV }}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Clean up per-run cache tags
      if: ${{ always() && runner.environment == 'self-hosted' && env.CACHE_RUN_TAG != '' }}
      run: |
        for TARGET in TESTER RUNNER; do
          REPO_VAR="CACHE_REPO_${TARGET}"
          REPO="${!REPO_VAR:-}"
          [ -n "$REPO" ] || continue
          "${{ github.action_path }}/scripts/buildcache.sh" purge "$REPO" "${CACHE_RUN_TAG}" || true
        done
      shell: bash
